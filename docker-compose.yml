version: "3.8"

services:

  # Configure Ingress (nginx)
  configure_ingress:
    volumes:
      - ./nginx/etc:/nginx_repo_configs:ro
      - ./nginx/html:/nginx_repo_html:ro
      - ../MarvinOS_Data/nginx:/nginx:rw
      - ../MarvinOS_Data/certs:/certs:rw
      - ../MarvinOS_Data/html:/html:rw
    build:
      context: ./
      dockerfile: Dockerfile.NginxConfig
    restart: "no"
    networks:
      - default
      - MarvinOSNET

  ingress:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../MarvinOS_Data/nginx:/etc/nginx:ro
      - ../MarvinOS_Data/certs:/certs:ro
      - ../MarvinOS_Data/html:/var/www/html:ro
    networks:
      - default
      - MarvinOSNET
    depends_on:
      - open-webui
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t -c /etc/nginx/nginx.conf >/tmp/nginx_check.log 2>&1 || { cat /tmp/nginx_check.log; exit 1; }
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    gpus: all
    environment:
      - OLLAMA_HOST=0.0.0.0
      - DEFAULT_MODELS=neural-chat
    volumes:
      - ../MarvinOS_Data/ollama:/root/.ollama:rw
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - default
      - MarvinOSNET

  # Model pull jobs
  pull-llm-ollama-llama3:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: llama3
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-mistral:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: mistral
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-codellama:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: codellama
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-neural-chat:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: neural-chat
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-llama2:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: llama2
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-phi:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: phi
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-wizard-math:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: wizard-math
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-openchat:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: openchat
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  pull-llm-ollama-tinyllama:
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    command: tinyllama
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: "no"

  # Open-WebUI  
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=llama3.2:3b
      - ENABLE_AUTH=true
      - ENABLE_SIGNUP=true
      - WEBUI_SECRET_KEY=---open-webui-key---
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_KEY=--openai-edge-tts-key--
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://openai-edge-tts:5050
    volumes:
      - ../MarvinOS_Data/open-webui:/app/backend/data:rw
    depends_on:
      - ollama
    networks:
      - default
      - MarvinOSNET
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://open-webui:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # openai-edge-tts 
  openai-edge-tts:
    image: travisvn/openai-edge-tts:latest
    container_name: openai-edge-tt
    ports:
      - "5050:5050"
    environment:
      - API_KEY=--openai-edge-tts-key--
    networks:
      - default
      - MarvinOSNET
    restart: unless-stopped



networks:
  default:
    driver: bridge
  MarvinOSNET:
    driver: bridge
