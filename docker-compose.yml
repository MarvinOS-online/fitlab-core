services:

  configure_env:
    user: "$HOST_UID:${HOST_GID}"
    volumes:
      - ../MarvinOS_Data:/data:rw
    build:
      context: ./
      dockerfile: Dockerfile.env
    restart: "no"

  configure_ingress:
    volumes:
      - ./nginx/etc:/nginx_repo_configs:ro
      - ./nginx/html:/nginx_repo_html:ro
      - ../MarvinOS_Data/nginx:/nginx:rw
      - ../MarvinOS_Data/certs:/certs:rw
      - ../MarvinOS_Data/html:/html/:rw
    build:
      context: ./
      dockerfile: Dockerfile.NginxConfig
    restart: "no"
    depends_on:
      configure_env:
        condition: service_completed_successfully

  configure_searxng:
    volumes:
      - ./searxng:/searxng_repo_configs:ro
      - ../MarvinOS_Data/searxng:/searxng:rw
    build:
      context: ./
      dockerfile: Dockerfile.SearxngConfig
    restart: "no"
    networks:
      - MarvinOSNET
    depends_on:
      configure_env:
        condition: service_completed_successfully

  ingress:
    image: nginx:latest
    container_name: ingress
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../MarvinOS_Data/nginx:/etc/nginx:ro
      - ../MarvinOS_Data/certs:/certs:ro
      - ../MarvinOS_Data/html:/html:ro
    networks:
      - MarvinOSNET
    depends_on:
      configure_env:
        condition: service_completed_successfully
      open-webui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -c /etc/nginx/nginx.conf >/tmp/nginx_check.log 2>&1 || { cat /tmp/nginx_check.log; exit 1; }"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    gpus: all
    env_file:
      - ../MarvinOS_Data/.env
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_CTX=4096
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=f16
      - OLLAMA_GPU_LAYERS=-1
      - OLLAMA_DISABLE_CACHE=0
    volumes:
      - ../MarvinOS_Data/ollama:/root/.ollama:rw
    #ports:
    #  - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - MarvinOSNET
    depends_on:
      configure_env:
        condition: service_completed_successfully

  pull-llm-ollama-models:
    container_name: pull-llm-ollama-models
    build:
      context: ./
      dockerfile: Dockerfile.pull-model
    networks:
      - MarvinOSNET
    restart: "no"
    depends_on:
      configure_env:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
#    ports:
#      - "8080:8080"
    env_file:
      - ../MarvinOS_Data/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=llama3.2:3b
      - ENABLE_AUTH=true
      - ENABLE_SIGNUP=true
      - ENABLE_CONVERSATIONAL_MEMORY=true
      - MEMORY_BACKEND=qdrant
      - ENABLE_PLUGINS=true

      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://openedai-speech:8000/v1

      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - WEB_SEARCH_RESULTS=10
      - WEB_SEARCH_TIMEOUT=5
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>

      - ENABLE_IMAGE_GENERATION=True
      - IMAGE_GENERATION_ENGINE=automatic1111
      - IMAGE_GENERATION_DEFAULT_STEPS=20
      - AUTOMATIC1111_BASE_URL=http://stable-diffusion:7860
      - IMAGE_GENERATION_MODEL=v1-5-pruned-emaonly

      - VECTOR_DB=qdrant
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_URI=http://qdrant:6333
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=qwen3-embedding:0.6b
      - ENABLE_RAG=true
      - ENABLE_CITATIONS=true

    volumes:
      - ../MarvinOS_Data/open-webui:/app/backend/data:rw
    networks:
      - MarvinOSNET
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://open-webui:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
    depends_on:
      configure_env:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      qdrant:
        condition: service_started

  openedai-speech:
    image: ghcr.io/matatonic/openedai-speech-min:latest
    container_name: openedai-speech
#    ports:
#      - "8000:8000"
    env_file:
      - ../MarvinOS_Data/.env
    volumes:
      - ../MarvinOS_Data/openedai-speech:/app/voices
    networks:
      - MarvinOSNET
    restart: unless-stopped
    depends_on:
      configure_env:
        condition: service_completed_successfully

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
 #   ports:
 #     - "8081:8080"
    env_file:
      - ../MarvinOS_Data/.env
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_INSTANCE_NAME=MarvinOS Search
      - SEARXNG_ALLOWED_HOSTS=*
    volumes:
      - ../MarvinOS_Data/searxng:/etc/searxng:rw
    networks:
      - MarvinOSNET
    depends_on:
      configure_env:
        condition: service_completed_successfully

  stable-diffusion:
    image: goolashe/automatic1111-sd-webui:latest
    container_name: stable-diffusion
#    ports:
#      - "7860:7860"
    env_file:
      - ../MarvinOS_Data/.env
    environment:
      CLI_ARGS: "--api --listen"
    volumes:
      - ../MarvinOS_Data/stable-diffusion:/data
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    networks:
      - MarvinOSNET
    restart: unless-stopped
    depends_on:
      configure_env:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    environment:
    - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
#    ports:
#      - "6333:6333"
    env_file:
      - ../MarvinOS_Data/.env
    volumes:
      - ../MarvinOS_Data/qdrant:/qdrant/storage
    networks:
      - MarvinOSNET
    restart: unless-stopped
    depends_on:
      configure_env:
        condition: service_completed_successfully

networks:
  MarvinOSNET:
    driver: bridge