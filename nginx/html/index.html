<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About — MarvinOS Online</title>
  <meta name="description" content="Learn more about John C. Vincent and the MarvinOS AI-driven home lab platform.">

  <!-- ---------- Open Graph / Social Preview ---------- -->

  <!-- ---------- Twitter / X ---------- -->

  <meta name="twitter:title" content="About — MarvinOS Online">
  <meta name="twitter:description" content="Learn more about John C. Vincent and the MarvinOS AI-driven home lab platform.">
  <meta name="twitter:image" content="https://marvinos.online/images/MOSAILab.jpg">

  <style>
    /* ---------- Reset & Base Styles ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Background image with subtle gradient overlay */
        background:
          url('images/background.png') repeat;
          linear-gradient(135deg, #f5f7fa, #c3cfe2),

      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px 20px 80px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #1a1a1a;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      color: #555;
    }

    /* ---------- Header Image ---------- */
    header {
      margin-bottom: 40px;
    }

    header img {
      max-width: 100%;
      width: 960px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    /* ---------- Buttons ---------- */
    .button-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 40px;
    }

    .button-container .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      text-align: center;
      white-space: nowrap;
    }

    .btn {
      text-decoration: none;
      padding: 15px 25px;
      background-color: #4a90e2;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn:hover {
      background-color: #357abd;
      transform: translateY(-2px);
    }

    /* ---------- Support Section (Glass Card) ---------- */
    .support-section {
      margin-top: 10px;
      padding: 24px 28px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 320px;
    }

    .support-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
      letter-spacing: 0.3px;
    }

    .support-subtitle {
      font-size: 0.9rem;
      color: #555;
    }

    .cashapp-img {
      width: 300px;
      max-width: 100vw;
      cursor: pointer;
      animation: subtlePulse 4s ease-in-out infinite;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .cashapp-img:hover {
      transform: scale(1.5);
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.25));
      animation-play-state: paused;
    }

    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    /* ---------- Footer ---------- */
    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #777;
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 400px) {
      h1 { font-size: 2.2rem; }
      p { font-size: 1rem; }
      .cashapp-img { width: 170px; }
    }
  </style>
</head>

<body>

  <header>
    <img src="images/MOSAILab.jpg" alt="MarvinOS AI Lab">
  </header>

  <div class="button-container">
    <a class="btn" href="/" target="_blank">Try MarvinOS.online Demo</a>
    <a class="btn" href="https://github.com/MarvinOS-online" target="_blank">Visit MarvinOS's GitHub</a>
    <a class="btn" href="https://discord.gg/ECqbKdyx" target="_blank">Visit MarvinOS's Discord</a>
    <a class="btn" href="resume.html">View My Resume</a>
  </div>

  <div class="support-section">
    <div class="support-title">Support MarvinOS</div>
    <div class="support-subtitle">Scan or tap to contribute</div>
    <a href="images/cashapp.png" target="_blank" aria-label="Support via Cash App">
      <img src="images/cashapp.png" alt="Cash App $Loik.B.Poki" class="cashapp-img" />
    </a>
  </div>

  <p></p>
  <h1>© 2026 John C. Vincent</h1>
  <p>Software Engineer & AI marvinos.online</p>

</body>
</html>
